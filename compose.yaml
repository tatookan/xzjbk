services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xinzhi
      POSTGRES_USER: xinzhi
      POSTGRES_PASSWORD: xinzhi_dev
    ports:
      - '5432:5432'
    volumes:
      - xinzhi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xinzhi -d xinzhi']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xinzhi-postgres:
